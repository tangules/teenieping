<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>캐치! 티니핑 한글 놀이 게임</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=4" />
</head>
<body>
  <canvas id="confetti-canvas"></canvas>
  <div class="bg-decor" id="bg-decor"></div>

  <div class="app-container">
    <!-- ==================== 1. 메인 시즌 선택 화면 ==================== -->
    <section id="home-screen" class="screen active">
      <div class="hero-header">
        <h1 class="hero-title">💖 캐치! 티니핑 한글 놀이 💖</h1>
        <p class="hero-subtitle">시즌을 고르고 티니핑 친구들의 이름을 맞춰보세요!</p>
      </div>

      <div class="settings-bar">
        <div class="setting-group">
          <span class="setting-label">🎯 문제:</span>
          <button class="pill-btn active" data-count="10" onclick="setQuestionCount(10)">10문제</button>
          <button class="pill-btn" data-count="20" onclick="setQuestionCount(20)">20문제</button>
          <button class="pill-btn" data-count="999" onclick="setQuestionCount(999)">전체</button>
        </div>
        <div class="setting-group">
          <button id="tts-toggle-btn" class="pill-btn active" onclick="toggleTTS()">하츄핑 목소리 켜짐 🔊</button>
          <button id="read-aloud-btn" class="pill-btn" onclick="toggleReadAloud()">버튼 읽어주기 꺼짐 🔤</button>
        </div>
      </div>

      <button class="collection-open-btn" onclick="openCollection()">
        📖 내 티니핑 도감 <span class="collection-count" id="collection-count">0/154</span>
      </button>

      <div class="season-grid">
        <button class="season-btn season-1" onclick="startGame(1)">
          <div class="thumb-wrap"><img src="image/1기_캐치_티니핑/01_하츄핑.webp" alt="하츄핑" /></div>
          <div class="season-info">
            <span class="season-tag">시즌 1</span>
            <div class="season-name">1기 캐치! 티니핑</div>
            <div class="season-count">45마리</div>
          </div>
        </button>

        <button class="season-btn season-2" onclick="startGame(2)">
          <div class="thumb-wrap"><img src="image/2기_반짝반짝_캐치_티니핑/01_다이아 하츄핑.webp" alt="다이아 하츄핑" /></div>
          <div class="season-info">
            <span class="season-tag">시즌 2</span>
            <div class="season-name">2기 반짝반짝</div>
            <div class="season-count">20마리</div>
          </div>
        </button>

        <button class="season-btn season-3" onclick="startGame(3)">
          <div class="thumb-wrap"><img src="image/3기_알쏭달쏭_캐치_티니핑/01_플로라 하츄핑.webp" alt="플로라 하츄핑" /></div>
          <div class="season-info">
            <span class="season-tag">시즌 3</span>
            <div class="season-name">3기 알쏭달쏭</div>
            <div class="season-count">21마리</div>
          </div>
        </button>

        <button class="season-btn season-4" onclick="startGame(4)">
          <div class="thumb-wrap"><img src="image/4기_새콤달콤_캐치_티니핑/01_베리 하츄핑.webp" alt="베리 하츄핑" /></div>
          <div class="season-info">
            <span class="season-tag">시즌 4</span>
            <div class="season-name">4기 새콤달콤</div>
            <div class="season-count">22마리</div>
          </div>
        </button>

        <button class="season-btn season-5" onclick="startGame(5)">
          <div class="thumb-wrap"><img src="image/5기_슈팅스타_캐치_티니핑/01_스타 하츄핑.webp" alt="스타 하츄핑" /></div>
          <div class="season-info">
            <span class="season-tag">시즌 5</span>
            <div class="season-name">5기 슈팅스타</div>
            <div class="season-count">24마리</div>
          </div>
        </button>

        <button class="season-btn season-6" onclick="startGame(6)">
          <div class="thumb-wrap"><img src="image/6기_프린세스_캐치_티니핑_및_극장판/01_프린세스 하츄핑.webp" alt="프린세스 하츄핑" /></div>
          <div class="season-info">
            <span class="season-tag">시즌 6</span>
            <div class="season-name">6기 프린세스</div>
            <div class="season-count">22마리</div>
          </div>
        </button>

        <button class="season-btn season-all" onclick="startGame('all')">
          <div class="multi-thumbs">
            <img src="image/1기_캐치_티니핑/01_하츄핑.webp" alt="1기" />
            <img src="image/2기_반짝반짝_캐치_티니핑/01_다이아 하츄핑.webp" alt="2기" />
            <img src="image/3기_알쏭달쏭_캐치_티니핑/01_플로라 하츄핑.webp" alt="3기" />
            <img src="image/4기_새콤달콤_캐치_티니핑/01_베리 하츄핑.webp" alt="4기" />
            <img src="image/5기_슈팅스타_캐치_티니핑/01_스타 하츄핑.webp" alt="5기" />
            <img src="image/6기_프린세스_캐치_티니핑_및_극장판/01_프린세스 하츄핑.webp" alt="6기" />
          </div>
          <div class="season-info">
            <span class="season-tag">👑 시즌 1~6 전체 통합</span>
            <div class="season-name">🌟 종합 한글 퀴즈 (<span id="total-count">154</span>마리 모두!)</div>
          </div>
        </button>
      </div>
    </section>

    <!-- ==================== 2. 퀴즈 게임 화면 ==================== -->
    <section id="quiz-screen" class="screen">
      <!-- 최상단 바: 좌측에 다시듣기/힌트, 우측에 진행상태/홈 버튼 배치 -->
      <div class="quiz-topbar">
        <div class="topbar-left">
          <button class="helper-btn voice-btn" onclick="speakCurrentAnswer()">🔊 다시듣기</button>
          <button class="helper-btn" onclick="toggleHint()">💡 힌트</button>
        </div>
        <div class="topbar-right">
          <span class="status-pill" id="char-season-badge">1기·로열</span>
          <span class="status-pill" id="progress-pill">1/10</span>
          <span class="status-pill" id="score-pill">⭐0</span>
          <button class="nav-btn" onclick="goHome()">🏠 홈</button>
        </div>
      </div>

      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>

      <div class="quiz-card">
        <!-- 제일 위: 순수 캐릭터 사진 영역 (2단계 글자 퍼즐 시 작게 축소됨) -->
        <div class="image-stage" id="image-stage">
          <img id="quiz-image" src="" alt="티니핑 이미지" />

          <div class="hint-box" id="hint-box"></div>
          <div class="catch-stamp" id="catch-stamp">CATCH!</div>
        </div>

        <!-- 중간: 2단계 초대형 한글 빈칸 슬롯 영역 (기존 대비 3배 확대한 큼직한 글자 칸!) -->
        <div class="syllable-learn-box" id="syllable-learn-box">
          <div class="syllable-blocks" id="syllable-blocks"></div>
        </div>

        <!-- 바로 아래: 1단계(4개 객관식 버튼) -> 2단계(6개 한글 음절 카드) -->
        <div class="choices-grid" id="choices-grid"></div>

        <!-- 하단 1줄 피드백 & 5초 자동 이동 안내 -->
        <div class="feedback-banner">
          <div class="feedback-msg" id="feedback-msg">버튼을 한 번 누르면 소리를 읽어줘요!</div>
          <button class="next-btn" id="next-btn" onclick="nextQuestion()">바로 다음 👉</button>
        </div>
      </div>
    </section>

    <!-- ==================== 4. 내 티니핑 도감 화면 ==================== -->
    <section id="collection-screen" class="screen">
      <div class="collection-header">
        <button class="nav-btn" onclick="goHome()">🏠 홈</button>
        <div class="collection-title">📖 내 티니핑 도감</div>
      </div>
      <div class="collection-summary" id="collection-summary"></div>
      <div class="collection-tip">한 번에 맞히면 티니핑을 캐치할 수 있어요! 잡은 친구를 누르면 이름을 들려줘요.</div>
      <div id="collection-list"></div>
    </section>

    <!-- ==================== 3. 결과 축하 화면 ==================== -->
    <section id="result-screen" class="screen">
      <div class="result-card">
        <div class="result-crown">👑🎉💖</div>
        <h2 class="result-title">참 잘했어요! 한글 박사님!</h2>
        <div class="result-score" id="result-score-text"></div>

        <div class="learned-words-title">👇 ⭐는 캐치 성공, 💪는 다음에 다시 도전! 이름을 누르면 들려줘요</div>
        <div class="learned-grid" id="learned-grid"></div>

        <div class="result-actions">
          <button class="action-big-btn" onclick="restartSameMode()">🔄 한 번 더 하기!</button>
          <button class="action-big-btn secondary" onclick="goHome()">🏠 다른 시즌 고르기</button>
        </div>
      </div>
    </section>
  </div>

  <script src="data/teenieping-data.js?v=4"></script>
  <script src="js/game.js?v=4"></script>
</body>
</html>
